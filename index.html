<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Голосовая касса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Unbounded:wght@600;800&display=swap">

<style>
/* Layout: iPhone-first one-hand app. Blue header band over a yellow stripe (flag), big mode switch, big mic, sticky total+save bar, two-tab bar. */
:root{
  --bg:#f2f5fb; --surface:#ffffff; --sunk:#e6ecf6; --line:#d3dcec;
  --ink:#0d1b33; --muted:#5b6b86;
  --blue:#0057b7; --blue-ink:#ffffff; --blue-soft:#dbe8f8;
  --yellow:#ffd700; --yellow-ink:#1a1500; --yellow-soft:#fff6c2; --yellow-text:#8a6d00;
  --danger:#c0261b; --danger-soft:#fde4e1;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1222; --surface:#121d33; --sunk:#1a2742; --line:#26365a;
  --ink:#eaf0fb; --muted:#9aa9c4;
  --blue:#2f80e8; --blue-ink:#ffffff; --blue-soft:#15294a;
  --yellow:#ffd500; --yellow-ink:#1a1500; --yellow-soft:#3a3210; --yellow-text:#ffd84d;
  --danger:#ff7b6e; --danger-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1222; --surface:#121d33; --sunk:#1a2742; --line:#26365a;
  --ink:#eaf0fb; --muted:#9aa9c4;
  --blue:#2f80e8; --blue-ink:#ffffff; --blue-soft:#15294a;
  --yellow:#ffd500; --yellow-ink:#1a1500; --yellow-soft:#3a3210; --yellow-text:#ffd84d;
  --danger:#ff7b6e; --danger-soft:#3d1c1a; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blue)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}

/* header = flag */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hblue{background:var(--blue);color:#fff;padding-block:14px 12px}
.hblue .wrap{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.hyellow{height:8px;background:var(--yellow)}
h1{font-family:var(--f-display);font-weight:800;font-size:19px;margin:0;letter-spacing:-.01em}
.store{font-size:12px;opacity:.85;text-align:right}
main{padding-block:16px}
h2{font-family:var(--f-display);font-weight:600;font-size:14px;margin:0}

/* mode switch */
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sunk);padding:5px;border-radius:999px}
.mode button{border:0;border-radius:999px;padding:14px 8px;font:700 17px var(--f-body);background:none;color:var(--muted);cursor:pointer}
.mode button[data-v=buy][aria-pressed=true]{background:var(--blue);color:var(--blue-ink)}
.mode button[data-v=sell][aria-pressed=true]{background:var(--yellow);color:var(--yellow-ink)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border-radius:14px;padding:10px 12px;min-width:0;border:1px solid var(--line)}
.tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile .val{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .cnt{font-size:12px;color:var(--muted)}

/* mic block */
.micbox{background:var(--surface);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;border:1px solid var(--line)}
.microw{display:flex;justify-content:space-between;width:100%;align-items:center;gap:8px}
.mic{width:116px;height:116px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 0 0 8px var(--yellow)}
.mode-sell .mic{background:var(--yellow);color:var(--yellow-ink);box-shadow:0 0 0 8px var(--blue)}
.mic svg{width:46px;height:46px}
.mic.on{animation:pulse 1.2s ease-in-out infinite;background:var(--danger);color:#fff}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.miclbl{font-weight:600;text-align:center}
.hint{font-size:14px;color:var(--ink);background:var(--yellow-soft);border-radius:12px;padding:10px 12px;width:100%}
textarea{width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);padding:12px}
input,select{font:16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input[type=date]{padding:6px 10px;font-size:15px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px var(--f-body);cursor:pointer}
.chip.danger{color:var(--danger);border-color:var(--danger)}

/* lines */
.lineshead{display:flex;justify-content:space-between;align-items:center}
.example{font-size:12px;font-weight:700;color:var(--yellow-text);background:var(--yellow-soft);border-radius:999px;padding:3px 10px}
.lines{display:flex;flex-direction:column;gap:10px}
.line{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mode-sell .line{border-left-color:var(--yellow)}
.line.warn{border-color:var(--danger);border-left-color:var(--danger);background:var(--danger-soft)}
.line .top{display:flex;gap:8px;align-items:center}
.line .name{flex:1;font-weight:700;font-size:17px;border:0;background:none;padding:2px 0}
.line .calc{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.line input.q{width:80px}.line input.p{width:90px}.line select{width:72px}
.line .bottom{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.line .alt{font-size:13px;color:var(--muted)}
.line .sum{font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto}
.x{border:0;background:var(--sunk);color:var(--muted);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;flex:none}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:15px}

/* sticky save bar */
.savebar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-block:10px}
.savebar .wrap{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.savebar .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.savebar .big{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.save{border:0;border-radius:999px;padding:14px 22px;font:800 16px var(--f-body);background:var(--blue);color:var(--blue-ink);cursor:pointer;white-space:nowrap}
.mode-sell .save{background:var(--yellow);color:var(--yellow-ink)}
.save:disabled{opacity:.45}

/* history */
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:700 15px var(--f-body);padding:10px 8px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px color-mix(in srgb,var(--ink) 18%,transparent)}
.seg.type button[data-v=buy][aria-pressed=true]{background:var(--blue);color:var(--blue-ink)}
.seg.type button[data-v=sell][aria-pressed=true]{background:var(--yellow);color:var(--yellow-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .lbl{font-weight:800;text-align:center;flex:1}
.nav button{width:44px;height:44px;border-radius:50%;border:0;background:var(--sunk);color:var(--ink);font-size:22px;cursor:pointer}
.big-total{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big-total b{font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:13px}
.cmp div{background:var(--bg);border-radius:12px;padding:8px 10px;min-width:0}
.cmp b{display:block;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.buy{background:var(--blue)} .dot.sell{background:var(--yellow)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:14px;padding:13px 10px;font:700 15px var(--f-body);cursor:pointer;background:var(--sunk);color:var(--ink)}
.btn.primary{background:var(--blue);color:var(--blue-ink)}
.day{display:flex;flex-direction:column;gap:8px}
.dayhead{display:flex;justify-content:space-between;font-weight:800;font-size:15px;padding-top:4px}
.rec{background:var(--bg);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.rec .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rec ul{margin:0;padding:0;list-style:none;font-size:14px;display:flex;flex-direction:column;gap:3px}
.rec li{display:flex;justify-content:space-between;gap:10px}
.rec li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr 1fr;
  padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabbar button{border:0;background:none;color:var(--muted);font:700 13px var(--f-body);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:14px;cursor:pointer;height:52px;justify-content:center}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-selected=true]{color:var(--blue);background:var(--blue-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:15px;z-index:20;max-width:calc(100% - 32px);text-align:center}
</style>

</head><body>
<header>
  <div class="hblue pad"><div class="wrap">
    <h1>Голосовая касса</h1>
    <div class="store" id="store">Подключаю…</div>
  </div></div>
  <div class="hyellow"></div>
</header>

<main class="pad">
  <section id="view-rec" class="wrap mode-buy">
    <div class="mode" id="mode">
      <button type="button" data-v="buy" aria-pressed="true">Закупка</button>
      <button type="button" data-v="sell" aria-pressed="false">Продажа</button>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="micbox">
      <div class="microw">
        <span class="small muted" id="moderow">Что купили</span>
        <input type="date" id="date" aria-label="Дата">
      </div>
      <button type="button" class="mic" id="mic" aria-label="Записать голос">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <div class="miclbl" id="miclbl">Нажмите и говорите</div>
      <div class="hint" id="hint" hidden></div>
      <textarea id="text" placeholder="апельсины 100 кг по 90, манго 30 штук по 80"></textarea>
      <div class="microw"><span class="small muted">Цена — за кг или штуку</span><button type="button" class="chip" id="clear">Очистить</button></div>
    </div>
    <div class="lineshead"><h2>Расчёт</h2><span class="example" id="ex" hidden>Пример</span></div>
    <div class="lines" id="lines"></div>
    <button type="button" class="chip" id="add" style="align-self:flex-start">+ Добавить строку</button>
  </section>

  <section id="view-hist" class="wrap" hidden>
    <div class="seg type" id="h-type">
      <button type="button" data-v="buy" aria-pressed="true">Закупки</button>
      <button type="button" data-v="sell" aria-pressed="false">Продажи</button>
    </div>
    <div class="seg" id="h-period">
      <button type="button" data-v="day" aria-pressed="true">День</button>
      <button type="button" data-v="week" aria-pressed="false">Неделя</button>
      <button type="button" data-v="month" aria-pressed="false">Месяц</button>
    </div>
    <div class="card">
      <div class="nav">
        <button type="button" id="h-prev" aria-label="Назад">‹</button>
        <div class="lbl" id="h-label"></div>
        <button type="button" id="h-next" aria-label="Вперёд">›</button>
      </div>
      <div class="big-total"><span class="muted" id="h-tlabel">Потрачено</span><b id="h-total">0 грн</b></div>
      <div class="cmp" id="h-cmp"></div>
      <div class="btnrow">
        <button type="button" class="btn primary" id="h-xlsx">Скачать Excel</button>
        <button type="button" class="btn" id="h-copy">Копировать</button>
      </div>
    </div>
    <div class="tiles" id="h-tiles"></div>
    <div class="card"><h2>Записи</h2><div id="h-list"></div></div>
    <div class="card"><h2>По товарам</h2><div class="tbl" id="h-items"></div></div>
  </section>
</main>

<div class="savebar pad" id="savebar"><div class="wrap">
  <div><div class="lbl" id="totlbl">Итого к оплате</div><div class="big" id="total">0 грн</div></div>
  <button type="button" class="save" id="save">Сохранить</button>
</div></div>

<nav class="tabbar" role="tablist">
  <button type="button" role="tab" data-tab="rec" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    Запись</button>
  <button type="button" role="tab" data-tab="hist" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h4M7 17h7"/></svg>
    История</button>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
// PARSER START
const NUMW = {
  "ноль":0,"один":1,"одна":1,"одну":1,"одного":1,"два":2,"две":2,"дві":2,"три":3,"четыре":4,"чотири":4,"пять":5,"п'ять":5,"шесть":6,"шість":6,
  "семь":7,"сім":7,"восемь":8,"вісім":8,"девять":9,"дев'ять":9,"десять":10,"одиннадцать":11,"одинадцять":11,"двенадцать":12,"дванадцять":12,
  "тринадцать":13,"тринадцять":13,"четырнадцать":14,"чотирнадцять":14,"пятнадцать":15,"п'ятнадцять":15,"шестнадцать":16,"шістнадцять":16,
  "семнадцать":17,"сімнадцять":17,"восемнадцать":18,"вісімнадцять":18,"девятнадцать":19,"дев'ятнадцять":19,"двадцать":20,"двадцять":20,
  "тридцать":30,"тридцять":30,"сорок":40,"пятьдесят":50,"п'ятдесят":50,"шестьдесят":60,"шістдесят":60,"семьдесят":70,"сімдесят":70,
  "восемьдесят":80,"вісімдесят":80,"девяносто":90,"дев'яносто":90,"сто":100,"двести":200,"двісті":200,"триста":300,"четыреста":400,
  "чотириста":400,"пятьсот":500,"п'ятсот":500,"шестьсот":600,"шістсот":600,"семьсот":700,"сімсот":700,"восемьсот":800,"вісімсот":800,
  "девятьсот":900,"дев'ятсот":900,"полтора":1.5,"полторы":1.5,"півтора":1.5
};
const THOUSAND = /^(тысяч[аи]?|тисяч[аі]?)$/;
const STOP = new Set(["купил","купила","купили","куплено","покупка","закупка","закупил","закупила","закупили","взял","взяла","взяли",
  "продал","продала","продали","продано","продажа","отдал","отдали","и","а","ещё","еще","также","так","потом","плюс","это","у","меня","я",
  "мы","ну","вот","дальше","далее","следующий","следующее","итого","всего","по","і","та","ще","купив","продав","взяв","також","потім",
  "грн","гривен","гривны","гривень","гривня","гривні","гривнi","гривна","руб","цена","ціна","штука","за","на","с","з","ценой","кило-"]);

function unitOf(w){
  if (/^(кг|кило|килограмм[а-яіїє]*|килограм[а-яіїє]*|кілограм[а-яіїє]*|кіло|кіл)$/.test(w)) return "кг";
  if (/^(г|гр|грамм[а-яіїє]*|грам[а-яіїє]*)$/.test(w)) return "г";
  if (/^(ящ|ящик[а-яіїє]*|ящиков|ящіка?|ящиків)$/.test(w)) return "ящ";
  if (/^(шт|штук[а-яіїє]*|штуч[а-яіїє]*|штуки|штучок)$/.test(w)) return "шт";
  if (/^(коробк[а-яіїє]*|коробок|кор)$/.test(w)) return "кор";
  if (/^(пуч[а-яіїє]*)$/.test(w)) return "пуч";
  if (/^(меш[а-яіїє]*)$/.test(w)) return "меш";
  if (/^(пачк[а-яіїє]*|пачек|пач)$/.test(w)) return "пач";
  if (/^(упаков[а-яіїє]*|уп)$/.test(w)) return "уп";
  return null;
}

function tokenize(text){
  let s = (text||"").toLowerCase().replace(/ё/g,"е").replace(/[’ʼ`]/g,"'");
  s = s.replace(/(\d)\s*[,.]\s*(\d)/g,"$1.$2");          // 10,5 -> 10.5
  s = s.replace(/(\d)\s+(\d{3})(?!\d)/g,(m,a,b)=>a+b);   // 1 200 -> 1200
  s = s.replace(/(\d)([a-zа-яіїє])/gi,"$1 $2").replace(/([a-zа-яіїє])(\d)/gi,"$1 $2");
  s = s.replace(/[;:!?«»"()\n\r\t,/\\–—-]+/g," ").replace(/\.(?!\d)/g," ");
  const raw = s.split(/\s+/).filter(Boolean);
  const out = [];
  for (let i=0;i<raw.length;i++){
    const w = raw[i];
    // number words and digits, with "тысяча" multiplier
    if (/^\d+(\.\d+)?$/.test(w) || (w in NUMW)){
      let total=0, cur=0, used=false;
      while (i<raw.length){
        const t = raw[i];
        if (/^\d+(\.\d+)?$/.test(t)){ if (used && cur && !THOUSAND.test(raw[i+1]||"")) break; cur += parseFloat(t); used=true; i++; }
        else if (t in NUMW){ const v=NUMW[t]; if (used && cur && v>=cur && v<1000 && v!==1.5) break; cur += v; used=true; i++; }
        else if (THOUSAND.test(t) && used){ total += (cur||1)*1000; cur=0; i++; }
        else break;
      }
      i--;
      out.push({t:"num", v: total+cur});
      continue;
    }
    if (w==="полкило"||w==="півкіло"){ out.push({t:"num",v:0.5},{t:"unit",u:"кг"}); continue; }
    if ((w==="с"||w==="з") && /^половин/.test(raw[i+1]||"")){ out.push({t:"half"}); i++; continue; }
    if (/^половин/.test(w)){ out.push({t:"half"}); continue; }
    const u = unitOf(w);
    if (u){ out.push({t:"unit",u}); continue; }
    if (w==="по") { out.push({t:"po"}); continue; }
    if (w==="или"||w==="або"||w==="либо") { out.push({t:"ili"}); continue; }
    if (w==="на"||w==="за") { out.push({t:"na",w}); continue; }
    out.push({t:"word",w});
  }
  return out;
}

function pickPrimary(qtys, priceUnit){
  if (!qtys.length) return null;
  if (priceUnit){ const m = qtys.find(q=>q.u===priceUnit); if (m) return m; }
  const order = ["кг","шт","пуч","пач","уп","кор","меш",null,"ящ"];
  for (const u of order){ const m = qtys.find(q=>q.u===u); if (m) return m; }
  return qtys[0];
}

function finishItem(it){
  if (!it.words.length && !it.qtys.length && it.price==null && it.total==null) return null;
  const prim = pickPrimary(it.qtys, it.priceUnit);
  let qty = prim ? prim.v : (it.total!=null||it.price!=null ? 1 : 0);
  let unit = prim ? (prim.u || it.priceUnit || "кг") : (it.priceUnit || "кг");
  let price = it.price;
  if (price==null && it.total!=null) price = qty ? +(it.total/qty).toFixed(2) : it.total;
  const alt = it.qtys.filter(q=>q!==prim && !(prim && q.u===prim.u && q.v===prim.v)).map(q=>fmtNum(q.v)+" "+(q.u||"")).join(", ");
  let name = it.words.join(" ").trim();
  name = name ? name[0].toUpperCase()+name.slice(1) : "Товар";
  return {name, qty: +(+qty).toFixed(3), unit, price: price==null ? null : +price, alt};
}

function parseText(text){
  const toks = tokenize(text);
  const items = [];
  let cur = null;
  const fresh = ()=>({words:[],qtys:[],price:null,total:null,priceUnit:null,lastIli:false});
  const push = ()=>{ if (cur){ const r = finishItem(cur); if (r) items.push(r); } cur = fresh(); };
  cur = fresh();
  for (let i=0;i<toks.length;i++){
    const k = toks[i], prev = toks[i-1], next = toks[i+1];
    if (k.t==="num"){
      if (prev && prev.t==="po"){
        cur.price = k.v;
        // "по 450 за ящик" / "по 90 за кг"
        if (next && next.t==="na" && toks[i+2] && toks[i+2].t==="unit"){ cur.priceUnit = toks[i+2].u==="г"?"кг":toks[i+2].u; i+=2; }
        else if (next && next.t==="unit"){ cur.priceUnit = next.u; i+=1; }
        push(); continue;
      }
      if (prev && prev.t==="na" && !(next && next.t==="unit")){ cur.total = k.v; push(); continue; }
      let q = {v:k.v, u:null};
      if (next && next.t==="unit"){ q.u = next.u; i++; }
      if (q.u==="г"){
        const last = cur.qtys[cur.qtys.length-1];
        if (last && last.u==="кг" && !cur.lastIli){ last.v = +(last.v + q.v/1000).toFixed(3); continue; }
        q = {v:+(q.v/1000).toFixed(3), u:"кг"};
      }
      // new product name already started after previous quantities -> previous item had no price
      cur.qtys.push(q); cur.lastIli=false; continue;
    }
    if (k.t==="half"){ const last = cur.qtys[cur.qtys.length-1]; if (last) last.v += 0.5; else if (cur.price!=null) cur.price+=0.5; continue; }
    if (k.t==="unit"){ // unit before number, e.g. "кг 10" — attach to last unitless qty
      const last = cur.qtys[cur.qtys.length-1];
      if (last && !last.u){ last.u = k.u==="г"?"кг":k.u; if (k.u==="г") last.v=+(last.v/1000).toFixed(3); }
      continue;
    }
    if (k.t==="ili"){ cur.lastIli = true; continue; }
    if (k.t==="po"||k.t==="na") continue;
    if (k.t==="word"){
      if (STOP.has(k.w)) continue;
      if (cur.qtys.length && cur.words.length) push();   // "апельсины 100 кг мандарины ..." without price
      cur.words.push(k.w);
    }
  }
  push();
  return items.map(it=>({...it, sum: it.price==null ? 0 : round2(it.qty*it.price)}));
}
function round2(n){ return Math.round(n*100)/100; }
function fmtNum(n){ return (+n).toLocaleString("ru-RU",{maximumFractionDigits:3}); }

/* dates */
const pad = n=>String(n).padStart(2,"0");
const dstr = d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dparse = s=>{const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d);};
const today = ()=>dstr(new Date());
function range(kind, anchor){
  const d = dparse(anchor);
  if (kind==="day") return [anchor, anchor];
  if (kind==="week"){ const wd=(d.getDay()+6)%7; const a=new Date(d); a.setDate(d.getDate()-wd); const b=new Date(a); b.setDate(a.getDate()+6); return [dstr(a),dstr(b)]; }
  return [dstr(new Date(d.getFullYear(),d.getMonth(),1)), dstr(new Date(d.getFullYear(),d.getMonth()+1,0))];
}
const MON = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const MONF = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const DOW = ["вс","пн","вт","ср","чт","пт","сб"];
function rangeLabel(kind,[a,b]){
  const A=dparse(a),B=dparse(b);
  if (kind==="day") return (a===today()?"Сегодня, ":DOW[A.getDay()]+", ")+A.getDate()+" "+MON[A.getMonth()];
  if (kind==="week") return A.getDate()+" "+MON[A.getMonth()]+" – "+B.getDate()+" "+MON[B.getMonth()];
  return MONF[A.getMonth()]+" "+A.getFullYear();
}
function shift(kind, anchor, dir){
  const d=dparse(anchor);
  if (kind==="day") d.setDate(d.getDate()+dir);
  else if (kind==="week") d.setDate(d.getDate()+7*dir);
  else { d.setDate(1); d.setMonth(d.getMonth()+dir); }
  return dstr(d);
}
function plural(n,a,b,c){ const m=n%10,h=n%100; return m===1&&h!==11?a:(m>=2&&m<=4&&(h<12||h>14)?b:c); }

// перенос записей из прошлой версии «Голосовой склад» (sklad.v1 / sklad.sales.v1)
function migrateOld(){
  try{
    if (localStorage.getItem("golos-kassa-migrated")) return;
    const groups = {};
    [["buy","sklad.v1"],["sell","sklad.sales.v1"]].forEach(([type,key])=>{
      (JSON.parse(localStorage.getItem(key)||"[]")||[]).forEach(r=>{
        const g = type+"|"+r.date+"|"+(r.check||r.ts||r.id);
        const rec = groups[g] = groups[g] || {id:"old-"+type+"-"+(r.check||r.ts||r.id), type, date:r.date, ts:r.ts||0, text:"", lines:[], total:0};
        if (r.buyer) rec.buyer = r.buyer;
        if (r.paid!=null) rec.paid = r.paid;
        const sum = round2(+r.total||(+r.qty||0)*(+r.price||0));
        rec.lines.push({name:r.name||"Товар", qty:+r.qty||0, unit:r.unit||"кг", price:+r.price||0, sum, alt:""});
        rec.total = round2(rec.total+sum);
      });
    });
    const add = Object.values(groups).filter(g=>g.date);
    if (add.length){ records = records.concat(add); lsSave(); }
    localStorage.setItem("golos-kassa-migrated","1");
  }catch(e){}
}

function aggregate(list){
  const m = new Map();
  list.forEach(r=>(r.lines||[]).forEach(l=>{
    const key = (l.name||"").toLowerCase()+"|"+l.unit;
    const a = m.get(key) || {name:l.name,unit:l.unit,qty:0,sum:0};

  return [...m.values()].sort((a,b)=>b.sum-a.sum);
}

$("#h-xlsx").onclick = async()=>{
  const rg = range(H.period,H.anchor);
  const name = `${TYPE[H.type].many}_${rg[0]===rg[1]?rg[0]:rg[0]+"_"+rg[1]}.xlsx`;
  try{
    if (!window.XLSX) throw {message:"нет библиотеки Excel"};
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(tableRows()); ws["!cols"]=[{wch:11},{wch:7},{wch:22},{wch:9},{wch:5},{wch:9},{wch:11},{wch:14}];
    XLSX.utils.book_append_sheet(wb, ws, "Записи");
    const ag = [["Товар","Кол-во","Ед.","Ср. цена","Сумма"]].concat(aggregate(periodRecords(H.type)).map(a=>[a.name,a.qty,a.unit,round2(a.sum/(a.qty||1)),a.sum]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ag), "По товарам");
    const buf = XLSX.write(wb,{type:"array",bookType:"xlsx"});
    saveBlob(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}), name);
  }catch(e){
    if (e && e.code==="declined") return;
    toast("Не получилось скачать: "+(e&&e.message||e&&e.code||"ошибка"));
  }
};
$("#h-copy").onclick = async()=>{
  const tsv = tableRows().map(r=>r.map(c=>typeof c==="number"?String(c).replace(".",","):c).join("\t")).join("\n");
  try{ await navigator.clipboard.writeText(tsv); toast("Скопировано — вставьте в Excel или Заметки"); }
  catch(e){ toast("Копирование не разрешено в этом окне"); }
};
document.querySelectorAll("#h-type button").forEach(b=>b.onclick=()=>{ H.type=b.dataset.v; renderHistory(); });

$("#h-prev").onclick = ()=>{ H.anchor = shift(H.period,H.anchor,-1); renderHistory(); };
$("#h-next").onclick = ()=>{ H.anchor = shift(H.period,H.anchor,1); renderHistory(); };

function saveBlob(blob, name){
  const f = (window.File && navigator.canShare) ? new File([blob], name, {type: blob.type}) : null;
  if (f && navigator.canShare({files:[f]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)){
    navigator.share({files:[f], title:name}).then(()=>toast("Готово: "+name)).catch(()=>{});
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast("Файл сохранён: "+name);
}
/* tabs */
function showTab(tab){
  document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  $("#view-rec").hidden = tab!=="rec"; $("#view-hist").hidden = tab!=="hist"; $("#savebar").hidden = tab!=="rec";
  try{ localStorage.setItem("golos-kassa-tab", tab); }catch(e){}
  window.scrollTo(0,0);
}
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
